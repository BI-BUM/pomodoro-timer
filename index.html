<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(25:00) Focus | Pomodoro Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s ease;
        }
        /* Custom smooth transition for circular SVG ring */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s linear, stroke 0.5s ease;
        }
        /* Glassmorphism panel styling */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        /* Mode glowing rings */
        .mode-focus-glow {
            box-shadow: 0 0 30px rgba(244, 63, 94, 0.2);
        }
        .mode-break-glow {
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
        }

        /* Gentle eye-friendly background pulse animation (3 times) */
        @keyframes gentle-bg-pulse {
            0%, 100% {
                background-color: #020617; /* bg-slate-950 */
            }
            50% {
                background-color: #1e293b; /* bg-slate-800 */
            }
        }
        .flash-bg {
            animation: gentle-bg-pulse 0.6s ease-in-out 3;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-full flex flex-col justify-between items-center p-4 sm:p-6 overflow-x-hidden antialiased select-none">

    <!-- Header Section -->
    <header class="w-full max-w-md flex justify-between items-center py-4 px-2">
      <div class="flex items-center space-x-2">
        <img src="icon.svg" alt="Pomodoro Icon" class="w-8 h-8 rounded-xl shadow-lg shadow-rose-500/20">
        <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">Pomodoro</h1>
      </div>

        <div class="flex items-center space-x-2">
            <!-- Fullscreen Toggle Button -->
            <button id="fullscreen-btn" aria-label="Toggle Fullscreen" title="Toggle Fullscreen (F)" class="p-2.5 rounded-xl bg-slate-800/60 hover:bg-slate-700/80 border border-slate-700/50 text-slate-300 hover:text-white transition-all duration-200 active:scale-95">
                <svg id="enter-fs-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
                </svg>
                <svg id="exit-fs-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 9L4 4m0 0l5 0m-5 0l0 5m11 4l5 5m0 0l-5 0m5 0l0-5m-11 0l-5 5m0 0l5 0m-5 0l0-5m11-11l5-5m0 0l-5 0m5 0l0 5"/>
                </svg>
            </button>

            <!-- Settings Button -->
            <button id="open-settings-btn" aria-label="Settings" title="Settings" class="p-2.5 rounded-xl bg-slate-800/60 hover:bg-slate-700/80 border border-slate-700/50 text-slate-300 hover:text-white transition-all duration-200 active:scale-95">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-md my-auto my-6 flex flex-col items-center">
        <div id="timer-card" class="w-full glass-panel rounded-3xl p-6 sm:p-8 flex flex-col items-center transition-all duration-500 mode-focus-glow">
            
            <!-- Mode Toggle Switcher -->
            <div class="grid grid-cols-2 gap-2 bg-slate-900/80 p-1.5 rounded-2xl border border-slate-800 w-full mb-8">
                <button id="focus-mode-btn" class="py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 bg-rose-500 text-white shadow-lg shadow-rose-500/30">Focus (25m)</button>
                <button id="break-mode-btn" class="py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 text-slate-400 hover:text-white">Break (5m)</button>
            </div>

            <!-- Central Circular Timer Display -->
            <div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center my-2 cursor-pointer" id="timer-circle-area" title="Double click to toggle fullscreen">
                <svg class="w-full h-full -rotate-90 transform" viewBox="0 0 280 280">
                    <!-- Background Circle Ring -->
                    <circle cx="140" cy="140" r="120" stroke="currentColor" stroke-width="10" class="text-slate-800/70" fill="transparent"/>
                    <!-- Animated Progress Ring Circle -->
                    <circle id="progress-circle" class="progress-ring__circle text-rose-500" stroke="currentColor" stroke-width="10" stroke-dasharray="753.98" stroke-dashoffset="0" stroke-linecap="round" cx="140" cy="140" r="120" fill="transparent"/>
                </svg>

                <!-- Timer Inner Content -->
                <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                    <!-- Mode Badge -->
                    <span id="status-badge" class="px-3.5 py-1 rounded-full text-xs font-bold tracking-widest uppercase bg-rose-500/10 text-rose-400 border border-rose-500/20 mb-2">FOCUS</span>
                    <!-- Time Output -->
                    <span id="time-display" class="text-5xl sm:text-6xl font-extrabold tracking-tight font-mono text-white my-1">25:00</span>
                </div>
            </div>

            <!-- Controls Toolbar -->
            <div class="flex items-center justify-center gap-4 mt-8 w-full">
                <!-- Reset Button -->
                <button id="reset-btn" title="Reset (R)" class="p-3.5 rounded-2xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700/60 transition-all duration-200 active:scale-95 shadow-md">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                </button>

                <!-- Primary Start/Pause Toggle Button -->
                <button id="start-pause-btn" title="Start/Pause (Space)" class="flex-1 py-3.5 px-6 rounded-2xl bg-gradient-to-r from-rose-500 to-rose-600 hover:from-rose-400 hover:to-rose-500 text-white font-bold text-base shadow-lg shadow-rose-500/25 transition-all duration-200 active:scale-95 flex items-center justify-center gap-2">
                    <svg id="start-icon" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/>
                    </svg>
                    <svg id="pause-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5 0a1 1 0 012 0v4a1 1 0 11-2 0V8z" clip-rule="evenodd"/>
                    </svg>
                    <span id="start-pause-text">Start</span>
                </button>

                <!-- Skip Button -->
                <button id="skip-btn" title="Skip (S)" class="p-3.5 rounded-2xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700/60 transition-all duration-200 active:scale-95 shadow-md">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <!-- Footer Section -->
    <footer class="w-full max-w-md text-center py-4">
        <p class="text-xs text-slate-500 font-medium">Shortcuts: Space (Start/Pause) | R (Reset) | S (Skip) | F (Fullscreen)</p>
    </footer>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="glass-panel w-full max-w-sm rounded-3xl p-6 border border-slate-700/80 shadow-2xl transform scale-95 transition-transform duration-300" id="settings-modal-card">
            
            <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-5">
                <h2 class="text-lg font-bold text-white">Timer Settings</h2>
                <button id="close-settings-cross" class="text-slate-400 hover:text-white p-1 rounded-lg transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <form id="settings-form" class="space-y-4">
                <div>
                    <label for="focus-input" class="block text-xs font-semibold text-slate-300 mb-1.5">Focus Duration (mins)</label>
                    <input type="number" id="focus-input" min="1" max="120" value="25" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-rose-500/50 focus:border-rose-500 font-mono text-sm transition-all">
                </div>

                <div>
                    <label for="break-input" class="block text-xs font-semibold text-slate-300 mb-1.5">Break Duration (mins)</label>
                    <input type="number" id="break-input" min="1" max="60" value="5" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 font-mono text-sm transition-all">
                </div>

                <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-800 mt-6">
                    <button type="button" id="cancel-settings-btn" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-400 hover:text-white hover:bg-slate-800 transition-all">Cancel</button>
                    <button type="submit" class="px-5 py-2 rounded-xl text-sm font-semibold bg-rose-500 hover:bg-rose-400 text-white shadow-lg shadow-rose-500/20 transition-all">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Timer state management
        let focusDuration = 25; // minutes
        let breakDuration = 5;   // minutes
        let currentMode = 'focus'; // 'focus' | 'break'
        let timeLeft = focusDuration * 60; // seconds
        let isRunning = false;
        let timerInterval = null;

        // SVG Circle Configuration
        const RADIUS = 120;
        const CIRCUMFERENCE = 2 * Math.PI * RADIUS;

        // DOM Element references
        const focusBtn = document.getElementById('focus-mode-btn');
        const breakBtn = document.getElementById('break-mode-btn');
        const progressCircle = document.getElementById('progress-circle');
        const statusBadge = document.getElementById('status-badge');
        const timeDisplay = document.getElementById('time-display');
        const startPauseBtn = document.getElementById('start-pause-btn');
        const startPauseText = document.getElementById('start-pause-text');
        const startIcon = document.getElementById('start-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const resetBtn = document.getElementById('reset-btn');
        const skipBtn = document.getElementById('skip-btn');
        const timerCard = document.getElementById('timer-card');
        const timerCircleArea = document.getElementById('timer-circle-area');

        // Fullscreen elements
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const enterFsIcon = document.getElementById('enter-fs-icon');
        const exitFsIcon = document.getElementById('exit-fs-icon');

        // Settings Modal references
        const openSettingsBtn = document.getElementById('open-settings-btn');
        const closeSettingsCross = document.getElementById('close-settings-cross');
        const cancelSettingsBtn = document.getElementById('cancel-settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const settingsModalCard = document.getElementById('settings-modal-card');
        const settingsForm = document.getElementById('settings-form');
        const focusInput = document.getElementById('focus-input');
        const breakInput = document.getElementById('break-input');

        // Play a single chime sound
        function playSingleChime() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }
                const now = ctx.currentTime;

                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(659.25, now); // E5
                osc1.frequency.exponentialRampToValueAtTime(880.00, now + 0.12); // A5
                gain1.gain.setValueAtTime(0.2, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.start(now);
                osc1.stop(now + 0.45);

                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(523.25, now + 0.12); // C5
                osc2.frequency.exponentialRampToValueAtTime(1046.50, now + 0.25); // C6
                gain2.gain.setValueAtTime(0.15, now + 0.12);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc2.start(now + 0.12);
                osc2.stop(now + 0.45);
            } catch (err) {
                console.error("Web Audio error:", err);
            }
        }

        // Web Audio API notification sound generator (Reliably plays 3 times with setTimeout)
        function playCompletionChime() {
            playSingleChime();
            setTimeout(playSingleChime, 600);
            setTimeout(playSingleChime, 1200);
        }

        // Trigger gentle background flashing synchronized with the chime
        function triggerGentleFlash() {
            document.body.classList.remove('flash-bg');
            void document.body.offsetWidth; // Trigger reflow
            document.body.classList.add('flash-bg');

            setTimeout(() => {
                document.body.classList.remove('flash-bg');
            }, 1800);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log("Error attempting to enable fullscreen:", err);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateDisplay() {
            const formatted = formatTime(timeLeft);
            timeDisplay.textContent = formatted;

            const totalDurationSec = (currentMode === 'focus' ? focusDuration : breakDuration) * 60;
            const progressRatio = timeLeft / totalDurationSec;
            const strokeOffset = CIRCUMFERENCE * (1 - progressRatio);
            progressCircle.style.strokeDashoffset = strokeOffset;

            const capitalizedMode = currentMode === 'focus' ? 'Focus' : 'Break';
            document.title = `(${formatted}) ${capitalizedMode} | Pomodoro Timer`;
        }

        function updateModeUI() {
            if (currentMode === 'focus') {
                focusBtn.className = "py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 bg-rose-500 text-white shadow-lg shadow-rose-500/30";
                breakBtn.className = "py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 text-slate-400 hover:text-white";

                statusBadge.textContent = "FOCUS";
                statusBadge.className = "px-3.5 py-1 rounded-full text-xs font-bold tracking-widest uppercase bg-rose-500/10 text-rose-400 border border-rose-500/20 mb-2";

                progressCircle.style.stroke = "#f43f5e";
                timerCard.className = "w-full glass-panel rounded-3xl p-6 sm:p-8 flex flex-col items-center transition-all duration-500 mode-focus-glow";

                startPauseBtn.className = "flex-1 py-3.5 px-6 rounded-2xl bg-gradient-to-r from-rose-500 to-rose-600 hover:from-rose-400 hover:to-rose-500 text-white font-bold text-base shadow-lg shadow-rose-500/25 transition-all duration-200 active:scale-95 flex items-center justify-center gap-2";
            } else {
                breakBtn.className = "py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 bg-emerald-500 text-white shadow-lg shadow-emerald-500/30";
                focusBtn.className = "py-2.5 px-4 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 text-slate-400 hover:text-white";

                statusBadge.textContent = "BREAK";
                statusBadge.className = "px-3.5 py-1 rounded-full text-xs font-bold tracking-widest uppercase bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 mb-2";

                progressCircle.style.stroke = "#10b981";
                timerCard.className = "w-full glass-panel rounded-3xl p-6 sm:p-8 flex flex-col items-center transition-all duration-500 mode-break-glow";

                startPauseBtn.className = "flex-1 py-3.5 px-6 rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-white font-bold text-base shadow-lg shadow-emerald-500/25 transition-all duration-200 active:scale-95 flex items-center justify-center gap-2";
            }
        }

        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            startPauseText.textContent = 'Pause';
            startIcon.classList.add('hidden');
            pauseIcon.classList.remove('hidden');

            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    handleSessionComplete();
                }
            }, 1000);
        }

        function pauseTimer() {
            if (!isRunning) return;
            isRunning = false;
            startPauseText.textContent = 'Start';
            pauseIcon.classList.add('hidden');
            startIcon.classList.remove('hidden');

            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function toggleStartPause() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function handleSessionComplete() {
            pauseTimer();
            playCompletionChime();
            triggerGentleFlash();

            if (currentMode === 'focus') {
                currentMode = 'break';
                timeLeft = breakDuration * 60;
            } else {
                currentMode = 'focus';
                timeLeft = focusDuration * 60;
            }

            updateModeUI();
            updateDisplay();
            startTimer();
        }

        function skipSession() {
            pauseTimer();
            playCompletionChime();
            triggerGentleFlash();

            if (currentMode === 'focus') {
                currentMode = 'break';
                timeLeft = breakDuration * 60;
            } else {
                currentMode = 'focus';
                timeLeft = focusDuration * 60;
            }
            updateModeUI();
            updateDisplay();
            startTimer();
        }

        function resetTimer() {
            pauseTimer();
            timeLeft = (currentMode === 'focus' ? focusDuration : breakDuration) * 60;
            updateDisplay();
        }

        function switchMode(newMode) {
            if (currentMode === newMode) return;
            pauseTimer();
            currentMode = newMode;
            timeLeft = (currentMode === 'focus' ? focusDuration : breakDuration) * 60;
            updateModeUI();
            updateDisplay();
        }

        function openSettings() {
            pauseTimer();
            focusInput.value = focusDuration;
            breakInput.value = breakDuration;
            settingsModal.classList.remove('opacity-0', 'pointer-events-none');
            settingsModalCard.classList.remove('scale-95');
            settingsModalCard.classList.add('scale-100');
        }

        function closeSettings() {
            settingsModal.classList.add('opacity-0', 'pointer-events-none');
            settingsModalCard.classList.remove('scale-100');
            settingsModalCard.classList.add('scale-95');
        }

        function handleSaveSettings(e) {
            e.preventDefault();
            const newFocus = parseInt(focusInput.value, 10);
            const newBreak = parseInt(breakInput.value, 10);

            if (newFocus > 0 && newBreak > 0) {
                focusDuration = newFocus;
                breakDuration = newBreak;

                focusBtn.textContent = `Focus (${focusDuration}m)`;
                breakBtn.textContent = `Break (${breakDuration}m)`;

                timeLeft = (currentMode === 'focus' ? focusDuration : breakDuration) * 60;
                updateDisplay();
                closeSettings();
            }
        }

        // Action Event Listeners
        startPauseBtn.addEventListener('click', toggleStartPause);
        resetBtn.addEventListener('click', resetTimer);
        skipBtn.addEventListener('click', skipSession);

        focusBtn.addEventListener('click', () => switchMode('focus'));
        breakBtn.addEventListener('click', () => switchMode('break'));

        fullscreenBtn.addEventListener('click', toggleFullscreen);
        timerCircleArea.addEventListener('dblclick', toggleFullscreen);

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                enterFsIcon.classList.add('hidden');
                exitFsIcon.classList.remove('hidden');
            } else {
                enterFsIcon.classList.remove('hidden');
                exitFsIcon.classList.add('hidden');
            }
        });

        // Keyboard Shortcuts Handler
        document.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT') return;

            if (e.code === 'Space') {
                e.preventDefault();
                toggleStartPause();
            } else if (e.key === 'r' || e.key === 'R') {
                resetTimer();
            } else if (e.key === 's' || e.key === 'S') {
                skipSession();
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            }
        });

        openSettingsBtn.addEventListener('click', openSettings);
        closeSettingsCross.addEventListener('click', closeSettings);
        cancelSettingsBtn.addEventListener('click', closeSettings);
        settingsForm.addEventListener('submit', handleSaveSettings);

        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) {
                closeSettings();
            }
        });

        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
